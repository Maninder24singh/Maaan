<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contract Type Card</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0c;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .stat-card {
    width: 280px;
    padding: 22px 20px 24px;
    border-radius: 22px;
    background: linear-gradient(160deg, #3a3230 0%, #1c1a19 60%, #101010 100%);
    color: #fff;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }

  .stat-card__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    color: #e9e5e2;
    margin-bottom: 14px;
  }

  .stat-card__header .expand {
    opacity: 0.6;
    font-size: 14px;
  }

  .stat-card__donut-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto 18px;
  }

  .learn-more {
    position: absolute;
    top: 14px;
    left: 4px;
    font-size: 11px;
    color: #cfc9c5;
    background: rgba(255,255,255,0.08);
    padding: 4px 10px;
    border-radius: 12px;
    text-decoration: none;
    z-index: 3;
  }

  .donut {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* orange pie slice for 93%, dark remainder for the other 7% */
    background: conic-gradient(
      from 0deg,
      #ff7a1a 0%,
      #ff9a3d 93%,
      rgba(255,255,255,0.06) 93%,
      rgba(255,255,255,0.06) 100%
    );
    box-shadow:
      inset 0 8px 20px rgba(255,255,255,0.25),
      inset 0 -14px 24px rgba(0,0,0,0.45),
      0 10px 30px rgba(255,122,26,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .donut__value {
    font-size: 40px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .badge {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(30,28,27,0.9);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    backdrop-filter: blur(2px);
    z-index: 2;
  }

  .badge--top-right {
    top: -6px;
    right: -6px;
  }

  .badge--left {
    top: 40%;
    left: -14px;
  }

  .stat-card__footer {
    display: flex;
    justify-content: space-between;
    text-align: center;
  }

  .stat-card__footer .stat {
    flex: 1;
  }

  .stat-card__footer .stat strong {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: #ff9a3d;
  }

  .stat-card__footer .stat span {
    display: block;
    font-size: 11px;
    color: #b8b3b0;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="stat-card">
  <div class="stat-card__header">
    <span>Contract Type</span>
    <span class="expand">&#8599;</span>
  </div>

  <div class="stat-card__donut-wrap">
    <a class="learn-more" href="#">Learn More &rsaquo;</a>
    <div class="donut">
      <span class="donut__value">93%</span>
    </div>
    <div class="badge badge--top-right">21%</div>
    <div class="badge badge--left">9%</div>
  </div>

  <div class="stat-card__footer">
    <div class="stat">
      <strong>94%</strong>
      <span>Satisfaction</span>
    </div>
    <div class="stat">
      <strong>140</strong>
      <span>Milestone</span>
    </div>
    <div class="stat">
      <strong>140</strong>
      <span>Milestone</span>
    </div>
  </div>
</div>

</body>
</html>
